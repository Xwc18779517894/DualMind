<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DualMind · 共同工作空间</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#" aria-label="DualMind 首页"><span class="brand-mark"><i></i><i></i></span><span>DualMind<small>两种思路，一起向前。</small></span></a>
    <button class="new-session" id="new-session"><span>＋</span> 新建会话 <kbd>New</kbd></button>
    <div class="nav-label">你的空间</div>
    <nav aria-label="主导航">
      <button data-view="workspace" class="nav-item active"><span data-icon="chat"></span>工作空间</button>
      <button data-view="history" class="nav-item"><span data-icon="history"></span>会话记录 <span id="history-count" class="nav-count">0</span></button>
      <button data-view="reports" class="nav-item"><span data-icon="file"></span>分析报告</button>
      <button data-view="settings" class="nav-item"><span data-icon="settings"></span>模型设置</button>
      <button data-view="guide" class="nav-item"><span data-icon="spark"></span>使用指南</button>
    </nav>
    <div class="recent-heading"><span class="nav-label">最近会话</span><button id="all-history" aria-label="查看所有会话">全部 <span>↗</span></button></div>
    <div id="recent-sessions" class="recent-sessions"></div>
    <div class="sidebar-bottom">
      <div class="local-status"><span class="status-dot"></span><span>本地运行<small>内容与历史保存在你的电脑</small></span></div>
      <div class="sidebar-meta"><span>DualMind <span id="version">0.4</span></span><button id="theme-toggle" aria-label="切换深色模式" title="切换深色模式"><span data-icon="moon"></span></button><button id="exit-app" aria-label="退出应用" title="退出应用"><span data-icon="power"></span></button></div>
    </div>
  </aside>
  <main class="main-shell">
    <header class="topbar">
      <div class="breadcrumb"><button class="icon-button" id="sidebar-toggle" aria-label="展开或收起菜单"><span data-icon="menu"></span></button>你的空间 <span>/</span> <strong id="page-label">工作空间</strong></div>
      <div class="topbar-right"><span id="test-badge" class="test-badge" hidden>离线验证 · 模拟模型</span><button class="provider-pill" id="provider-status"></button><span class="user-avatar">我</span></div>
    </header>
    <section id="page" class="page"></section>
  </main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="rename-dialog">
  <form id="rename-form"><h2>给会话起个名字</h2><p>让之后更容易找到它。</p><label for="rename-title">会话标题</label><input id="rename-title" maxlength="80" required autocomplete="off"><div class="dialog-actions"><button type="button" id="cancel-rename" class="button">取消</button><button type="submit" class="button primary">保存标题</button></div></form>
</dialog>
<dialog id="confirm-dialog">
  <form id="confirm-form"><h2 id="confirm-title">确认操作</h2><p id="confirm-detail"></p><div class="dialog-actions"><button type="button" id="confirm-cancel" class="button">取消</button><button type="submit" id="confirm-ok" class="button primary">确认</button></div></form>
</dialog>
</body>
</html>
